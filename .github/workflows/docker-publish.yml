name: Build and publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: udaynasya/test_tool
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$DOCKER_IMAGE:$GITHUB_SHA" .

      - name: Check Chromium launches
        run: >-
          docker run --rm --init --shm-size=1g --entrypoint node "$DOCKER_IMAGE:$GITHUB_SHA"
          --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();'

      - name: Push image
        run: |
          docker push "$DOCKER_IMAGE:$GITHUB_SHA"
          docker tag "$DOCKER_IMAGE:$GITHUB_SHA" "$DOCKER_IMAGE:latest"
          docker push "$DOCKER_IMAGE:latest"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout
